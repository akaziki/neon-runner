<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120a2a">
<title>霓虹跑酷 Neon Runner</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hide">
  <div class="glass stat"><span class="lbl">SCORE</span><b id="hScore">0</b></div>
  <div class="glass stat"><span class="lbl">COINS</span><b id="hCoins" class="gold">0</b></div>
  <div class="glass stat sm"><span class="lbl">SPEED</span><b id="hSpeed">1.0×</b></div>
</div>
<button id="mute" class="glass" title="静音">♪</button>
<div id="loader"><div class="ltitle">NEON RUNNER</div><div class="bar"><i id="lbar"></i></div><div class="lpct" id="lpct">加载中 0%</div></div>
<div id="menu" class="hide">
  <div class="title"><small>霓 虹 跑 酷</small><h1>NEON<span>RUNNER</span></h1><p class="tag">奔跑在午夜的天际线之上</p></div>
  <div class="glass panel" id="panel">
    <div id="overBox" class="hide"><div class="over">RUN ENDED</div><div class="row"><div><span class="lbl">分数</span><b id="oScore">0</b></div><div><span class="lbl">金币</span><b id="oCoins" class="gold">0</b></div><div><span class="lbl">最高</span><b id="oBest">0</b></div></div><div id="newRec" class="rec hide">新纪录</div></div>
    <div id="startBox"><div class="row"><div><span class="lbl">最高分</span><b id="sBest">0</b></div></div>
    <div class="keys"><span><kbd>Space</kbd><kbd>↑</kbd> 跳跃 · 可二段跳</span><span><kbd>↓</kbd> 滑铲</span><span class="mob">手机：轻点跳跃 · 下滑滑铲</span></div></div>
    <button id="go">开始奔跑</button>
  </div>
</div>
<script src="game.js?v=3"></script>
</body>
</html>
